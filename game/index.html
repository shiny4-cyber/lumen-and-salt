<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen &amp; Salt — a tethered dive into the Halcyon Trench</title>
<meta name="description" content="Lumen and Salt: pilot a tethered bathyscaphe into a flooded trench, grapple drifting wrecks, cut the salvage free and surface before the air runs out.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03161a; }
  body { font-family: "Trebuchet MS", system-ui, sans-serif; color: #e8f5f1; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #boot p { color: #8fb3b0; font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Lumen and Salt: a tethered bathyscaphe dives a flooded trench. Grapple drifting wrecks, cut salvage free, manage oxygen and ballast, and surface before the air runs out."></canvas>
<p id="status" role="status" aria-live="polite">Lumen and Salt. Press Space to dive.</p>
<div id="boot"><p>flooding the trench…</p></div>
<script type="module" src="./src/main.js"></script>
<script>
  // The canvas paints over the boot line as soon as the module's first frame lands.
  requestAnimationFrame(function hideBoot() {
    requestAnimationFrame(function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  });
</script>
</body>
</html>
